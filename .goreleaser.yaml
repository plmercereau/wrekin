# GoReleaser configuration (v2 schema).
# Validate with `goreleaser check`; CI runs it on every pull request.
version: 2

project_name: wrekin

before:
  hooks:
    - go mod tidy

builds:
  - id: wrekin
    main: ./cmd/wrekin
    binary: wrekin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "merge conflict"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Build and packaging
      regexp: '^.*?build(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999

release:
  github:
    owner: plmercereau
    name: wrekin
  draft: false
  prerelease: auto
  footer: |
    ## Install

    - Homebrew: `brew install plmercereau/tap/wrekin`
    - Nix: `nix run github:plmercereau/wrekin`
    - Or download the archive for your platform above.

# Homebrew formula, pushed to the tap repository plmercereau/homebrew-tap.
# A formula (not a cask) because `brew services` needs the `service` block to
# run the daemon as a user-level launchd agent / systemd unit.
brews:
  - name: wrekin
    ids:
      - default
    repository:
      owner: plmercereau
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    commit_author:
      name: goreleaser
      email: goreleaser@users.noreply.github.com
    commit_msg_template: "wrekin {{ .Tag }}"
    homepage: https://wrekin.platyplus.io
    description: Teleport a Claude Code Cloud session onto one of your own machines, from Claude, with no inbound connection
    license: MIT
    # Pre-releases (v1.2.3-rc1 ...) are not pushed to the tap.
    skip_upload: auto
    caveats: |
      Pair this machine with your Wrekin account, then start the daemon:
        wrekin auth
        brew services start wrekin
    service: |
      run [opt_bin/"wrekin", "daemon"]
      keep_alive true
      log_path var/"log/wrekin.log"
      error_log_path var/"log/wrekin.log"
      working_dir HOMEBREW_PREFIX
    test: |
      assert_match version.to_s, shell_output("#{bin}/wrekin --version")
